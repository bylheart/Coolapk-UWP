name: 自动同步上游 Coolapk-UWP/Coolapk-UWP 仓库
on:
  schedule:
    - cron: '17 20 * * *' # UTC；北京时间次日 04:17。避开整点可降低高负载时的延迟概率
  workflow_dispatch:
concurrency:
  group: sync-upstream-master
  cancel-in-progress: true
permissions:
  contents: write

jobs:
  sync-fork:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 执行同步
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # --source 填写上游仓库，格式为 OWNER/REPO，不附加分支名
          # --branch 指定源仓库与目标仓库中要同步的同名分支
          # --force 会将目标分支硬重置为源分支状态；目标分支的独有提交可能丢失
          # gh repo sync "${{ github.repository }}" --source "tgymnich/fork-sync" --branch "main" --force
          gh repo sync "${{ github.repository }}" --source "Coolapk-UWP/Coolapk-UWP" --branch "revived"
